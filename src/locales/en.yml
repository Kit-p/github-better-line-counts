name: GitHub Better Line Counts
description: Remove generated files from GitHub line counts
saveChanges: Save Changes
discard: Discard
cancel: Cancel
diffs:
  additionsText:
    1: $1 addition
    n: $1 additions
  deletionsText:
    1: $1 deletion
    n: $1 deletions
  generatedText: $1 generated
  generatedTextInline: ($1 generated)
  additionsSymbol: +$1
  deletionsSymbol: −$1
  generatedSymbol: ⌁$1
  truncated: ⌁ N/A
  truncatedTitle: GitHub's API returns at most $1 files for a comparison and this one has more, so the counts were left as GitHub shows them and no breakdown is available.
breakdown:
  other: Other
  generated: Generated
  files:
    1: $1 file
    n: $1 files
options:
  title: Options
  patternHint: Patterns use .gitignore syntax. A name without a slash matches at any depth; a pattern containing a slash is anchored to the repository root; a trailing "/" matches everything inside a directory; "!" removes files matched by earlier lines; lines starting with "#" are comments. Matching is case-insensitive.
  privateRepos:
    title: Access Private Repos
    description1: "Optional:"
    description2: To recalculate the diff on private repos, the extension needs a GitHub PAT to authenticate API requests.
    description3: Click here
    description4: to create one.
    inputPlaceholder: Personal access token...
    invalidToken: Token is invalid
    validToken: Token is valid
    checking: Checking token...
    username: "Username: $1"
  enabled:
    title: Show Generated Line Counts
    description1: Along with
    description2: +additions
    description3: and
    description4: −deletions
    description5: ", show a third number for"
    description6: ⌁generated
    description7: lines.
  customLists:
    title: Generated Files
    description1: Use
    description2: .gitignore-style
    description3: patterns to mark files as generated across all repos. Generated files are subtracted from the line counts, in addition to files marked as linguist-generated in the repo's .gitattributes.
    allRepos: All Repos
    restoreDefaults: Restore Defaults
    restoreDefaultsConfirm: Replace the generated patterns with the defaults? Your edits to the list will be lost.
    customRepoPlaceholder: |
      Enter glob patterns:
      *.lock
      **/vendor/**
  linguist:
    title: Linguist Attributes
    description1: Repositories can mark files in .gitattributes with
    description2: Linguist attributes
    description3: . Choose what happens to files carrying each attribute. These declarations take precedence over the pattern lists.
    targetGenerated: Generated (subtract from the counts)
    targetNone: No special handling
  pathTester:
    title: Path Tester
    description: Type a file path to see where the lists above would put it. Attributes from a repository's .gitattributes are not considered here.
    placeholder: src/components/Button.test.tsx
    generated: Generated (subtracted from the counts)
    other: Other
    matched: "Matched: $1"
    noMatch: No pattern matched
  transfer:
    title: Import & Export
    description: Save every setting except the access token to a file, or load them from one. Importing replaces the form; click Save Changes to keep the result.
    export: Export Settings
    import: Import Settings…
    importAction: Replace Settings
    importConfirm: Replace the current settings with the imported file? Nothing is saved until you click Save Changes.
    invalidFile: "This file could not be imported: $1"
  breakdown:
    title: Breakdown
    description: Group the remaining, non-generated lines into categories such as tests, docs, or configs. Categories never change the line counts. Hover over the counts to see how the lines are split up.
    enable: Show the breakdown when hovering over the line counts
    orderHint: Files are matched against the categories from top to bottom and the first match wins. Files that match no category are counted as "Other".
    addCategory: Add Category
    addPreset: Add Preset
    restoreDefaults: Restore Defaults
    restoreDefaultsConfirm: Replace all categories with the defaults? Any categories you've added or edited will be lost.
    nameLabel: Name
    namePlaceholder: Category name
    iconLabel: Icon
    colorLabel: Color
    customColor: Custom color…
    patternsLabel: Patterns
    patternsPlaceholder: |
      Enter glob patterns:
      *.test.*
      __tests__/
    moveUp: Move up
    moveDown: Move down
    remove: Remove category
    drag: Drag to reorder
